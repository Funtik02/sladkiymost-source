server {
    listen 443 ssl http2;
    server_name xn--80aimeddmqtil.xn--p1ai www.xn--80aimeddmqtil.xn--p1ai;

    ssl_certificate /etc/letsencrypt/live/xn--80aimeddmqtil.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80aimeddmqtil.xn--p1ai/privkey.pem;

    if ($host = www.xn--80aimeddmqtil.xn--p1ai) {
        return 301 https://xn--80aimeddmqtil.xn--p1ai$request_uri;
    }

    client_max_body_size 1m;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $sladkiymost http://sladkiymost-app:3001;
        proxy_pass $sladkiymost;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
