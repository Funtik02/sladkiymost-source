server {
    listen 443 ssl http2;
    server_name sladkiymost.147-45-158-67.sslip.io;

    ssl_certificate /etc/letsencrypt/live/sladkiymost.147-45-158-67.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sladkiymost.147-45-158-67.sslip.io/privkey.pem;

    client_max_body_size 1m;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $sladkiymost http://sladkiymost-app:3001;
        proxy_pass $sladkiymost;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
